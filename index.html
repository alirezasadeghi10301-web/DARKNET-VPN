<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DARKNET VPN</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#090909;color:#eee;
 font-family:Tahoma,Arial,sans-serif;
}
header{
 padding:25px 20px;background:#111;
 border-bottom:1px solid #a77b27;
}
.logo{color:#d6ad55;font-size:25px;font-weight:bold}
header p{color:#888;font-size:12px}
main{padding:20px;max-width:900px;margin:auto}
.card{
 background:#141414;border:1px solid #292929;
 border-radius:13px;padding:18px;margin-bottom:16px;
}
h3{color:#d6ad55;margin-top:0}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.number{font-size:25px;color:#d6ad55}
input{
 width:100%;padding:13px;margin:7px 0;
 background:#090909;color:white;
 border:1px solid #444;border-radius:8px;
}
button{
 background:#c49a45;color:#111;border:0;
 border-radius:8px;padding:12px 18px;
 font-weight:bold;cursor:pointer;
}
.user{
 padding:13px;border-bottom:1px solid #333;
 display:flex;justify-content:space-between;gap:8px;
}
small{color:#999}
.delete{background:#772b2b;color:white}
footer{text-align:center;color:#666;padding:25px;font-size:12px}
</style>
</head>
<body>
<header>
 <div class="logo">DARKNET VPN</div>
 <p>PRIVATE NETWORK MANAGEMENT PANEL</p>
</header>
<main>
 <div class="stats">
  <div class="card">
   <small>تعداد کاربران</small>
   <div class="number" id="count">0</div>
  </div>
  <div class="card">
   <small>وضعیت پنل</small>
   <div class="number">ONLINE</div>
  </div>
 </div>

 <div class="card">
  <h3>افزودن کاربر</h3>
  <input id="name" placeholder="نام کاربر">
  <input id="days" type="number" placeholder="مدت اعتبار (روز)">
  <button onclick="addUser()">افزودن کاربر</button>
 </div>

 <div class="card">
  <h3>مدیریت کاربران</h3>
  <div id="users"></div>
 </div>
 <div class="card">
  <small>نسخه 1.0 | DARKNET VPN</small>
 </div>
</main>
<footer>POWERED BY DARKNET</footer>
<script>
let users=JSON.parse(localStorage.getItem("darknet_users")||"[]");

function render(){
 document.getElementById("count").textContent=users.length;
 document.getElementById("users").innerHTML="";
 users.forEach((u,i)=>{
  let div=document.createElement("div");
  div.className="user";
  let info=document.createElement("span");
  info.textContent=u.name+" - "+u.days+" روز";
  let btn=document.createElement("button");
  btn.className="delete";
  btn.textContent="حذف";
  btn.onclick=()=>{users.splice(i,1);save()};
  div.append(info,btn);
  document.getElementById("users").append(div);
 });
}
function addUser(){
 let name=document.getElementById("name").value.trim();
 let days=Number(document.getElementById("days").value);
 if(!name||!Number.isInteger(days)||days<1)return;
 users.push({name,days});
 save();
 document.getElementById("name").value="";
 document.getElementById("days").value="";
}
function save(){
 localStorage.setItem("darknet_users",JSON.stringify(users));
 render();
}
render();
</script>
</body>
</html>
